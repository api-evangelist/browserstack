versioning:
  scheme: per-product path versioning, inconsistently applied
  detail: >-
    Percy is /api/v1. Test Management is /api/v2. App Automate versions per framework — Appium,
    Maestro and Media are v1 while Espresso, Flutter Android, Flutter iOS, Detox Android and
    XCUITest are v2. Automate labels its Selenium API "v1" on the reference index but serves
    unversioned paths (/automate/plan.json). Accessibility Testing and User Management publish
    no version at all. There is no Accept-header or date-based versioning on any surface.
  breaking_change_policy: not published
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    BrowserStack publishes no API deprecation policy, no notice period, and no RFC 8594
    Deprecation/Sunset headers. No deprecated operation is marked in any captured OpenAPI —
    though the specs in this repo are documentation-derived, so an absent `deprecated: true`
    is weak evidence either way. Product-level end-of-life announcements appear in the release
    notes feed under the "announcement" feature type, but there is no API-specific deprecation
    channel a client could subscribe to.
