entries_note: >-
  No dated entries are recorded here because none could be read without executing JavaScript.
  The page is a Beamer-hosted widget: the served HTML carries the filter vocabulary and page
  chrome only, and neither https://www.browserstack.com/release-notes/feed (returns the same
  Beamer HTML shell) nor https://www.browserstack.com/release-notes.rss (returns the marketing
  homepage) is a usable feed. Recording an empty entries[] with this note is the honest
  result; inventing dated entries from blog posts would not be.
api_specific_changelog: false
api_specific_note: >-
  The release-notes stream is product-scoped, not API-scoped. There is no changelog that tells
  an API client which endpoints, fields or response shapes changed, and no deprecation channel.
