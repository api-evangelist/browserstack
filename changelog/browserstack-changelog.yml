detail: >-
  BrowserStack publishes a single dated release-notes stream covering every product. It is
  faceted by Product (accessibility design toolkit, accessibility testing, app accessibility
  testing, app automate, app live, app percy, live, low code automation, percy, test
  management, test reporting and analytics, testing toolkit, website scanner), Feature Type
  (enhancement, new feature, announcement, device and os, enterprise, speedlab, webinars) and
  Release Type (beta launch, major release, product launch, minor release, private devices).
  Those facet vocabularies are the only part of the page present in the served HTML.
