method: searched
source: https://www.browserstack.com/pricing
note: >-
  This file REPLACES a 2026-05-04 bulk-sweep scaffold that invented Free / Professional /
  Enterprise API tiers with per-request quotas and overage pricing. BrowserStack sells no such
  thing. It sells seat-and-capacity subscriptions per PRODUCT (Live, Automate, App Live, App
  Automate, Test Management, Percy, Website Scanner, Accessibility), and API access is included
  with the product subscription rather than metered or priced separately. There is no API-only
  plan, no per-call price and no published API overage rate.
  PRICE CAPTURE IS PARTIAL AND SAYS SO. The pricing page renders its per-seat price table in
  JavaScript; the served HTML carries plan names, the entry-price claims quoted below, and one
  fully-serialized product matrix (Website Scanner). Per-seat prices for Live, Automate, App
  Live and App Automate are not in the HTML and are NOT guessed here.
description: >-
  BrowserStack published plans and pricing, read from the public pricing page. Product-scoped
  subscriptions; API access is a feature of the product plan, not a separately priced product.
currency: USD
billing_periods:
  - annual
  - monthly
pricing_model: per-seat subscription with capacity add-ons (parallel tests, devices, monitored
  pages); annual billing is discounted against month-to-month
api_metering: none-published
plan_count: 17
