note: >-
  BrowserStack publishes first-party client libraries across six ecosystems. The npm scope
  @browserstack and the npm publishers `browserstack` / `browserstack-admin`, the Maven
  groupId com.browserstack, the PyPI projects browserstack-sdk / browserstack-local, the
  RubyGems gem browserstack-local and the NuGet packages authored by "BrowserStack" are the
  first-party markers used here. Community wrappers (karma-browserstack-launcher,
  testcafe-browser-provider-browserstack, MartinCostello.BrowserStack.Automate, the
  scottgonzalez `browserstack` npm package) are excluded — they are not BrowserStack-authored.
