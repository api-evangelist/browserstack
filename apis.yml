description: >-
  BrowserStack provides instant access to 3,500+ real desktop browsers and 30,000+ real mobile
  device units for manual and automated software testing. Its products span cross-browser testing
  (Live, Automate), mobile app testing (App Live, App Automate), visual regression testing (Percy,
  App Percy), accessibility testing, test management, test reporting and analytics, and low-code
  automation. Each product exposes its own REST API on its own host, and BrowserStack ships an
  official Model Context Protocol server — hosted at mcp.browserstack.com and distributed as an npm
  package — carrying 44 tools across those products.
