note: >-
  BrowserStack serves OAuth 2.0 / OpenID Connect discovery documents from its marketing host,
  its Automate API host and its Enterprise API host, all pointing at a single issuer,
  https://auth.browserstack.com. The hosted Remote MCP server at mcp.browserstack.com
  publishes its own separate authorization server plus an RFC 9728 protected-resource
  document. No security.txt, api-catalog, ai-plugin.json or A2A agent card is served on any
  BrowserStack-controlled host. Two hosts answered 200 with an HTML shell for every
  /.well-known/* path and are recorded as misses, not documents: percy.io (BrowserStack's
  Percy product host) and test-management.browserstack.com. The security.txt served at
  status.browserstack.com belongs to Atlassian (Statuspage), not BrowserStack, and is
  excluded.
