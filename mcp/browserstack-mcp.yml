tools_available_remote: 39
tools:
- name: createProjectOrFolder
  category: Test Management
  description: Create a Test Management project and/or folders to organize test cases. Returns with Folder
    ID, Project ID and Test Management Link to access the TM Project Dashboard.
  remote_available: true
- name: createTestCase
  category: Test Management
  description: Add a manual test case under a specific project/folder (uses project identifier like PR-xxxxx
    and a folder ID).
  remote_available: true
- name: updateTestCase
  category: Test Management
  description: Update an existing test case. Any subset of fields may be changed (name, priority, status,
    steps, tags, etc.); only supplied fields are modified.
  remote_available: true
- name: listTestCases
  category: Test Management
  description: List test cases for a project, optionally scoped to a folder (supports filters like case_type,
    priority, and pagination).
  remote_available: true
- name: listFolders
  category: Test Management
  description: List folders in a Test Management project (returns each folder's id, name, case counts,
    and sub-folder counts). Pass a parent_id to list sub-folders.
  remote_available: true
- name: listTestCaseTemplates
  category: Test Management
  description: List test-case templates with their numeric template_id, for use with createTestCase to
    apply a custom template.
  remote_available: true
- name: createTestRun
  category: Test Management
  description: Create a test run (suite) for selected test cases in a project.
  remote_available: true
- name: listTestRuns
  category: Test Management
  description: List test runs for a project (filter by dates, assignee, state).
  remote_available: true
- name: updateTestRun
