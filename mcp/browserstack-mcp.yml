provider: BrowserStack
providerId: browserstack
name: BrowserStack MCP Server
status: published
description: BrowserStack's official Model Context Protocol server. It exposes 44 tools covering Test
  Management, Automate/App Automate SDK setup, Observability, Live and App Live manual sessions, Accessibility
  scanning, Percy visual testing, and BrowserStack's AI agents (test-case generation, low-code authoring,
  self-healing selectors, root-cause analysis).
deployment:
  mode: both
  endpoint: https://mcp.browserstack.com/mcp
  install: npx -y @browserstack/mcp-server@latest
  package: https://www.npmjs.com/package/@browserstack/mcp-server
  auth: oauth
  verified: probed
transports:
- streamable-http (remote)
- stdio (local, npx)
x-evidence:
  fetched: '2026-09-04'
  endpoint_probe:
    url: https://mcp.browserstack.com/mcp
    method: POST tools/list (jsonrpc 2.0)
    http_status: 401
    www_authenticate: Bearer realm="https://mcp.browserstack.com/mcp", resource_metadata="https://mcp.browserstack.com/.well-known/oauth-protected-resource"
    note: Live tool schemas are OAuth-gated. The tool list below is the provider-published catalog from
      the official repository README, names and descriptions only — inputSchemas require an authenticated
      tools/list call.
  protected_resource:
    url: https://mcp.browserstack.com/.well-known/oauth-protected-resource
    http_status: 200
    resource: https://mcp.browserstack.com/mcp
    authorization_servers:
    - https://mcp.browserstack.com
    scopes_supported:
    - read
    - write
    - admin
    bearer_methods_supported:
    - header
    - body
  authorization_server:
    url: https://mcp.browserstack.com/.well-known/oauth-authorization-server
    http_status: 200
    issuer: https://mcp.browserstack.com/
    registration_endpoint: https://mcp.browserstack.com/auth/oauth2/register
    grant_types_supported:
    - authorization_code
    - refresh_token
    code_challenge_methods_supported:
    - S256
    note: 'Dynamic client registration is open (token_endpoint_auth_methods_supported: none), so an MCP
      client can register itself with no pre-shared secret.'
authentication:
  remote: OAuth 2.1 authorization-code with PKCE (S256) against https://mcp.browserstack.com; dynamic
    client registration supported. No password or access key is shared with the client.
  local: Environment variables BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY, read from the account
    settings page.
remote_limitations:
- No Local Testing support — the hosted server cannot reach apps behind a VPN, firewall or localhost.
  Local Testing requires the stdio (npx) server.
- 'Five tools that depend on local file or process state are disabled on the remote server: createTestCasesFromFile,
  addPercySnapshotCommands, listTestFiles, runPercyScan, uploadProductRequirementFile.'
- Slightly higher latency than the local server (provider-stated).
