provider: BrowserStack
providerId: browserstack
note: Both sides of this crosswalk are partial by different causes. The MCP tool list is complete and
  provider-published, but its inputSchemas are OAuth-gated (401 on an anonymous tools/list), so every
  binding here is by name and documented semantics, never by comparing schemas. The REST side covers only
  the Automate API, the one BrowserStack product this repo holds an OpenAPI for; the Test Management,
  App Automate, Accessibility, Percy and Test Reporting APIs are all documented with base URLs and reference
  pages but published as HTML only, so tools backed by them land in mcp_only for lack of a contract to
  bind to, not for lack of a REST operation.
