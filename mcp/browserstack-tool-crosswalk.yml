- tool: getFailureLogs
  category: Observability
  rest:
  - getSessionLogs
  - getSessionConsoleLogs
  - getSessionNetworkLogs
  binding: semantic
  confidence: medium
  note: The tool retrieves error logs for an Automate/App Automate session. The Automate REST surface
    exposes three log endpoints on /automate/sessions/{sessionId}; which of them the tool calls is not
    stated in the provider docs and the live MCP schema is OAuth-gated, so this is a name/semantics binding,
    not a verified one.
- tool: getBuildId
  category: BrowserStack AI Agents
  rest:
  - listBuilds
  binding: semantic
  confidence: medium
  note: Resolves a build name to a build ID scoped to the caller. /automate/builds.json is the listing
    operation that carries build names and IDs.
- tool: listBuildId
  category: BrowserStack AI Agents
  rest:
  - listBuilds
  binding: semantic
  confidence: medium
  note: Same listing operation, without the per-user filter. The Automate REST spec in this repo has no
    documented cross-user variant, so the group-wide behaviour may come from a different internal surface.
- tool: listTestIds
  category: BrowserStack AI Agents
  rest:
  - listBuildSessions
  binding: semantic
  confidence: low
  note: '"Tests" in an Automate build correspond to sessions in /automate/builds/{buildId}/sessions.json,
    but the tool filters by passed/failed/pending/skipped and the REST operation is not documented as
    supporting that filter. Low confidence.'
- tool: fetchBuildInsights
  category: Observability
  rest:
  - listBuilds
  binding: partial
  confidence: low
  note: The tool combines build details with quality-gate results. Only the build half maps to the Automate
    REST surface; the quality-gate half is served by the Test Reporting and Analytics API, which is not
    captured as an OpenAPI in this repo.
